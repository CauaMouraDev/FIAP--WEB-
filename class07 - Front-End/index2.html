<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrosel 3D</title>
  </head>

  <body>
    <div class="scene">
      <div class="carousel">
        <img src="img/arrogante.jpg" style="--i: 0deg" />
        <img src="img/bozoxlula.jpg" style="--i: 40deg" />
        <img src="img/caiox.jpg" style="--i: 80deg" />
        <img src="img/cissoparaiba.jpg" style="--i: 120deg" />
        <img src="img/dileira.jpg" style="--i: 160deg" />
        <img src="img/foto.jpg" style="--i: 200deg" />
        <img src="img/mrbean.jpg" style="--i: 240deg" />
        <img src="img/Neymar.jpg" style="--i: 280deg" />
        <img src="img/poze.jpg" style="--i: 320deg" />
      </div>
    </div>
  </body>
  <style>
    body {
      background: black;
      margin: 0;
      padding: 0;
    }
    .scene {
      margin: 80px auto;
      width: 210px;
      position: relative;
      aspect-ratio: 4 / 5;
      perspective: 1000px;
    }
    .carousel {
      position: absolute;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      animation: rotate 30s infinite linear;
    }
    .carousel > img {
      position: absolute;
      top: 0;
      left: 0;
      width: 190px;
      aspect-ratio: 4 / 5;
      border-radius: 10px;
      transform: rotateY(var(--i)) translateZ(288px);
    }
    @keyframes rotate {
      0% {
        transform: rotateY(360deg);
      }
      100% {
        transform: rotateY(0deg);
      }
      0% {
        transform: rotateY(360deg);
      }
      50% {
        transform: rotateY(0deg);
      }
    }
  </style>
</html>
